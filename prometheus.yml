# Prometheus configuration file for Expense Tracker monitoring
# This configuration scrapes metrics from the Flask application's /metrics endpoint

global:
  # How often to scrape targets (default: 1m)
  scrape_interval: 15s
  
  # How long to wait before scraping a target again if it fails (default: 10s)
  scrape_timeout: 10s
  
  # How long metrics are retained (default: 15d)
  retention: 30d
  
  # External labels to add to any time series when communicating with external systems
  external_labels:
    cluster: 'expense-tracker'
    environment: 'development'

# Alertmanager configuration (optional - for alerting)
# Uncomment if you set up Alertmanager
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "alert_rules.yml"  # Uncomment to enable alerting rules

# Scrape configurations - defines which targets Prometheus scrapes
scrape_configs:
  # Scrape the Expense Tracker Flask application
  - job_name: 'expense-tracker'
    # How often to scrape this job
    scrape_interval: 15s
    
    # Timeout for scraping this job
    scrape_timeout: 10s
    
    # Metrics path (default: /metrics)
    metrics_path: '/metrics'
    
    # HTTP scheme (http or https)
    scheme: 'http'
    
    # Static targets - configure based on your deployment
    static_configs:
      # Option 1: Local development (when running Flask app locally)
      - targets: ['localhost:5001']
        labels:
          instance: 'expense-tracker-local'
          deployment: 'local'
      
      # Option 2: Docker Compose (when using docker-compose)
      # Uncomment when running with docker-compose
      # - targets: ['app:5001']
      #   labels:
      #     instance: 'expense-tracker-docker'
      #     deployment: 'docker'
      
      # Option 3: Production deployment
      # Uncomment and configure for your production environment
      # - targets: ['your-production-host:5001']
      #   labels:
      #     instance: 'expense-tracker-prod'
      #     deployment: 'production'
    
    # Optional: Relabel configurations for custom labeling
    # Uncomment and customize if needed
    # relabel_configs:
    #   - source_labels: [__address__]
    #     target_label: instance

