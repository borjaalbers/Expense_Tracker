version: '3.8'

services:
  # Flask application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense-tracker-app
    ports:
      - "5001:5001"
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-dev-secret-key-change-me-in-production}
      - DATABASE_URL=sqlite:////data/expense_tracker.db
      - PORT=5001
      - FLASK_DEBUG=0
    volumes:
      # Mount local database directory to use existing data and allow SQLite lock files
      - ./data:/data
      # Optional: Mount source code for development
      # - .:/app
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Prometheus service for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: expense-tracker-prometheus
    ports:
      - "9090:9090"
    volumes:
      # Mount Prometheus configuration (Docker version)
      - ./prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
      # Persist Prometheus data
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana service for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: expense-tracker-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      # Persist Grafana data
      - grafana_data:/var/lib/grafana
      # Mount provisioning configurations
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Mount dashboard JSON files
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# Named volumes for data persistence
volumes:
  expense_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# Network for service communication
networks:
  monitoring:
    driver: bridge

