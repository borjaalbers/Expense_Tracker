version: "3.9"

services:
  web:
    build:
      context: .
    command: python app.py
    ports:
      - "${PORT:-5001}:5001"
    environment:
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:-dev-secret-key}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:////data/expense_tracker.db}"
      PORT: "${PORT:-5001}"
    volumes:
      - ./:/app
      - expense_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  expense_data:

